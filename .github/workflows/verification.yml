name: Verification

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier les documents obligatoires
        run: |
          test -f VERSION
          test -f CHANGELOG.md
          test -f docs/01_Cahier_des_charges_fonctionnel.md
          test -f docs/02_Architecture_technique.md
          test -f docs/03_Impression_et_mode_kiosque.md
          test -f docs/05_Securite_et_acces.md
          test -f apps/api/database/001_noyau.sql
      - name: Interdire le tiret long
        run: |
          forbidden="$(printf '\342\200\224')"
          if git grep -n "$forbidden"; then
            echo "Le caractère typographique U+2014 est interdit. Utilisez le tiret ASCII."
            exit 1
          fi

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
      - name: Valider Composer
        run: composer validate --no-check-publish --no-check-lock
      - name: Installer les dépendances API
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Tester l'API
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee test-output.txt
      # Les échecs sont aussi publiés en annotations, lisibles sans le journal complet.
      - name: Signaler les tests en échec
        if: failure()
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' test-output.txt \
            | awk '/FAILED/ { show = 45 } show > 0 { print; show-- }' \
            | grep -v '^[[:space:]]*$' \
            | head -90 \
            | while IFS= read -r line; do echo "::error::${line}"; done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Installer les dépendances PWA
        run: npm ci
      - name: Vérifier TypeScript
        run: npm run typecheck
      - name: Tester la PWA
        run: npm test
      - name: Compiler la PWA
        run: npm run build

  images:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Vérifier l'image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
      - name: Vérifier l'image web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
