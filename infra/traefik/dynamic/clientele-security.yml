http:
  middlewares:
    clientele-security:
      headers:
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: geolocation=(), microphone=()
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
