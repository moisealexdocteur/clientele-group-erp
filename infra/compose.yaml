name: ${COMPOSE_PROJECT_NAME:-clientele-erp}

services:
  web:
    image: ghcr.io/moisealexdocteur/clientele-group-erp-web:${APP_IMAGE_TAG:-edge}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      - traefik-public
      - clientele-internal
    labels:
      # Les noms de routeur et de service sont fixes pour cette cible de production.
      # La préproduction utilise son propre fichier et le nom clientele-erp-preprod.
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.clientele-erp.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.clientele-erp.entrypoints=websecure"
      - "traefik.http.routers.clientele-erp.tls=true"
      - "traefik.http.routers.clientele-erp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clientele-erp.middlewares=clientele-security@file"
      - "traefik.http.routers.clientele-erp.priority=1000"
      - "traefik.http.routers.clientele-erp.service=clientele-erp"
      - "traefik.http.services.clientele-erp.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    image: ghcr.io/moisealexdocteur/clientele-group-erp-app:${APP_IMAGE_TAG:-edge}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: Clientèle Group ERP
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: fr
      APP_FAKER_LOCALE: fr_FR
      HASH_DRIVER: ${HASH_DRIVER:-argon2id}
      HASH_VERIFY: ${HASH_VERIFY:-true}
      ARGON_MEMORY: ${ARGON_MEMORY:-65536}
      ARGON_THREADS: ${ARGON_THREADS:-1}
      ARGON_TIME: ${ARGON_TIME:-4}
      AUTH_TOKEN_ABSOLUTE_MINUTES: ${AUTH_TOKEN_ABSOLUTE_MINUTES:-720}
      AUTH_TOKEN_IDLE_MINUTES: ${AUTH_TOKEN_IDLE_MINUTES:-120}
      AUTH_EMAIL_CODE_TTL_MINUTES: ${AUTH_EMAIL_CODE_TTL_MINUTES:-10}
      AUTH_EMAIL_CODE_MAX_ATTEMPTS: ${AUTH_EMAIL_CODE_MAX_ATTEMPTS:-5}
      APP_RUN_MIGRATIONS: "true"
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSLMODE: disable
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_SCHEME: ${SMTP_SCHEME:-smtp}
      MAIL_HOST: ${SMTP_HOST}
      MAIL_PORT: ${SMTP_PORT:-587}
      MAIL_USERNAME: ${SMTP_USERNAME}
      MAIL_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      MAIL_FROM_NAME: ${SMTP_FROM_NAME:-Clientèle Group}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      clientele-internal: {}
      clientele-egress:
        gw_priority: 1
    # Fichiers privés (reçus, photos, contrats) conservés entre deux déploiements.
    volumes:
      - clientele-documents:/var/www/api/storage/app/private
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: ghcr.io/moisealexdocteur/clientele-group-erp-app:${APP_IMAGE_TAG:-edge}
    restart: unless-stopped
    profiles: ["background"]
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=120
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: Clientèle Group ERP
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: fr
      HASH_DRIVER: ${HASH_DRIVER:-argon2id}
      HASH_VERIFY: ${HASH_VERIFY:-true}
      ARGON_MEMORY: ${ARGON_MEMORY:-65536}
      ARGON_THREADS: ${ARGON_THREADS:-1}
      ARGON_TIME: ${ARGON_TIME:-4}
      AUTH_TOKEN_ABSOLUTE_MINUTES: ${AUTH_TOKEN_ABSOLUTE_MINUTES:-720}
      AUTH_TOKEN_IDLE_MINUTES: ${AUTH_TOKEN_IDLE_MINUTES:-120}
      AUTH_EMAIL_CODE_TTL_MINUTES: ${AUTH_EMAIL_CODE_TTL_MINUTES:-10}
      AUTH_EMAIL_CODE_MAX_ATTEMPTS: ${AUTH_EMAIL_CODE_MAX_ATTEMPTS:-5}
      APP_RUN_MIGRATIONS: "false"
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSLMODE: disable
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_SCHEME: ${SMTP_SCHEME:-smtp}
      MAIL_HOST: ${SMTP_HOST}
      MAIL_PORT: ${SMTP_PORT:-587}
      MAIL_USERNAME: ${SMTP_USERNAME}
      MAIL_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      MAIL_FROM_NAME: ${SMTP_FROM_NAME:-Clientèle Group}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - clientele-internal
      - clientele-egress

  scheduler:
    image: ghcr.io/moisealexdocteur/clientele-group-erp-app:${APP_IMAGE_TAG:-edge}
    restart: unless-stopped
    profiles: ["background"]
    command: php artisan schedule:work
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: Clientèle Group ERP
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: fr
      HASH_DRIVER: ${HASH_DRIVER:-argon2id}
      HASH_VERIFY: ${HASH_VERIFY:-true}
      ARGON_MEMORY: ${ARGON_MEMORY:-65536}
      ARGON_THREADS: ${ARGON_THREADS:-1}
      ARGON_TIME: ${ARGON_TIME:-4}
      AUTH_TOKEN_ABSOLUTE_MINUTES: ${AUTH_TOKEN_ABSOLUTE_MINUTES:-720}
      AUTH_TOKEN_IDLE_MINUTES: ${AUTH_TOKEN_IDLE_MINUTES:-120}
      AUTH_EMAIL_CODE_TTL_MINUTES: ${AUTH_EMAIL_CODE_TTL_MINUTES:-10}
      AUTH_EMAIL_CODE_MAX_ATTEMPTS: ${AUTH_EMAIL_CODE_MAX_ATTEMPTS:-5}
      APP_RUN_MIGRATIONS: "false"
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSLMODE: disable
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_SCHEME: ${SMTP_SCHEME:-smtp}
      MAIL_HOST: ${SMTP_HOST}
      MAIL_PORT: ${SMTP_PORT:-587}
      MAIL_USERNAME: ${SMTP_USERNAME}
      MAIL_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      MAIL_FROM_NAME: ${SMTP_FROM_NAME:-Clientèle Group}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - clientele-internal
      - clientele-egress

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - clientele-postgres:/var/lib/postgresql/data
    networks:
      - clientele-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - clientele-redis:/data
    networks:
      - clientele-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  traefik-public:
    external: true
  clientele-internal:
    internal: true
  clientele-egress: {}

volumes:
  clientele-postgres:
  clientele-redis:
  clientele-documents:
