name: clientele-group-erp

services:
  web:
    image: ghcr.io/moisealexdocteur/clientele-group-erp-web:${APP_IMAGE_TAG:-edge}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      - traefik-public
      - clientele-internal
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.clientele-erp.rule: 'Host("${APP_DOMAIN}")'
      traefik.http.routers.clientele-erp.entrypoints: websecure
      traefik.http.routers.clientele-erp.tls: "true"
      traefik.http.routers.clientele-erp.middlewares: clientele-security@file
      traefik.http.services.clientele-erp.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    image: ghcr.io/moisealexdocteur/clientele-group-erp-app:${APP_IMAGE_TAG:-edge}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clientele-internal
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: ghcr.io/moisealexdocteur/clientele-group-erp-app:${APP_IMAGE_TAG:-edge}
    restart: unless-stopped
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=120
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clientele-internal

  scheduler:
    image: ghcr.io/moisealexdocteur/clientele-group-erp-app:${APP_IMAGE_TAG:-edge}
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clientele-internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - clientele-postgres:/var/lib/postgresql/data
    networks:
      - clientele-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - clientele-redis:/data
    networks:
      - clientele-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  traefik-public:
    external: true
  clientele-internal:
    internal: true

volumes:
  clientele-postgres:
  clientele-redis:
